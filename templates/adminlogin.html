{% extends "nav.html" %}
{% block content %}
{% load static %}
  <div class="container-fluid py-5 wow fadeInUp" data-wow-delay="0.1s">
    <br><br><br><br>
    <div class="container">
        <div class="text-center mx-auto mb-5" style="max-width: 600px;">
            <h5 class="text-uppercase" style="letter-spacing: 5px; color: var(--accent);">Command Override</h5>
            <h1 class="display-5 mb-0" style="color: var(--lavender);">Admin Login</h1>
        </div>
        <div class="row g-5 justify-content-center">
            <div class="col-lg-7 wow slideInUp" data-wow-delay="0.3s">
                <div class="glass-card p-5 mx-auto" style="max-width: 500px;">
                    <form method="post">
                        {% csrf_token %}
                        <div class="row g-3">
                            <div class="col-12">
                                <input type="text" class="form-control" placeholder="User Name" name="uname">
                            </div>
                            <div class="col-12">
                                <input type="password" class="form-control" placeholder="Password" name="psw">
                            </div>
                            <div class="col-12">
                                <button class="btn btn-primary w-100 py-3" type="submit">LOGIN</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <br><br><br><br>
</div>

{% for i in messages %}
<script>alert("{{i}}")</script>
{% endfor %}
{% endblock %}
