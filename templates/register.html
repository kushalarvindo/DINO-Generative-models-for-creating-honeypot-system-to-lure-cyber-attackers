{% extends "nav.html" %}
{% block content %}
{% load static %}
  <div class="container-fluid py-5 wow fadeInUp" data-wow-delay="0.1s">
    <br>
    <div class="container">
        <div class="text-center mx-auto mb-5" style="max-width: 600px;">
            <h5 class="text-uppercase" style="letter-spacing: 5px; color: var(--accent);">New Operative</h5>
            <h1 class="display-5 mb-0" style="color: var(--lavender);">Register</h1>
        </div>
        <br><br>
        <div class="row g-5 justify-content-center">
            <div class="col-lg-8 wow slideInUp" data-wow-delay="0.3s">
                
                <div class="card glass-card p-4 shadow" style="background: transparent; border: none;">
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="row g-3">
                            <div class="col-md-6">
                                <input type="text" class="form-control" placeholder="First Name" name="fname">
                            </div>
                            <div class="col-md-6">
                                <input type="text" class="form-control" placeholder="Last Name" name="lname">
                            </div>
                            <div class="col-md-6">
                                <input type="text" class="form-control" placeholder="User Name" name="uname">
                            </div>
                            <div class="col-md-6">
                                <input type="email" class="form-control" placeholder="Email" name="email">
                            </div>
                            <div class="col-md-6">
                                <input type="password" class="form-control" placeholder="Password" name="psw">
                            </div>
                            <div class="col-md-6">
                                <input type="password" class="form-control" placeholder="Confirm Password" name="psw1">
                            </div>
                            <div class="col-12 mt-4">
                                <button class="btn btn-primary w-100 py-3" type="submit">CREATE CREDENTIALS</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <br><br>
</div>

{% for i in messages %}
<script>alert("{{i}}")</script>
{% endfor %}
{% endblock %}
